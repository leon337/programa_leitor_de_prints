name: Validar aplicação

on:
  push:
    branches:
      - main
      - leonpcsn/lea-100-lab-01-definir-e-implementar-o-mvp-do-leitor-de-prints
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint e build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install

      - name: Executar lint
        run: npm run lint

      - name: Executar build
        run: npm run build
